short_bio_text_justify: false
short_bio: >-
  <p>
    I am Yujian Cao (曹宇健), a Ph.D. student at the <a href="https://www.liverpool.ac.uk/computer-science-and-informatics/" target="_blank">School of Computer Science and Informatics</a>, <a href="https://www.liverpool.ac.uk/" target="_blank">University of Liverpool</a>, advised by <a href="https://www.liverpool.ac.uk/people/shufang-zhu" target="_blank">Dr. Shufang Zhu</a> and <a href="https://www.liverpool.ac.uk/people/sven-schewe" target="_blank">Prof. Sven Schewe</a>, with support from the <a href="https://www.csc.edu.cn/" target="_blank">China Scholarship Council (CSC)</a>.
    Before starting my PhD, I worked as a network engineer at China Unicom and in IT support at Festo.
  </p>
  <p>
    My current research focuses on formal methods, particularly reactive synthesis with linear temporal logic on finite traces (LTLf). I hope to explore interdisciplinary applications of formal methods, especially in artificial intelligence.
  </p>

